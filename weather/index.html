<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/header-n-footer.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/weather.css">
    <title>Weather Data</title>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZ7L34E9JR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-VZ7L34E9JR');
    </script>
    
    <!-- libs -->
    <script src="../scripts/jquery.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://maps.google.com/maps/api/js?sensor=false"></script>

</head>
<body>


    <header>
        <div class="container">
            <h1>Weather Data</h1>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/weather">Weather</a></li>
                    <li><a href="about-us">About Us</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main>
        <div class="wrapper">
            <div>
                <input type="text" name="city" id="city_search"/>
                <span>Zoek</span>
            </div>
            <section>
                <div id="weather_today">
                    <div class="today">
                        <div class="left">
                            <h2>Today</h2>
                            <p class="temperature"></p>
                            <p class="date">Now</p>
                            <p class="location"></p>
                        </div>
                        <div class="right">
                            <div class="right_items">
                                <div class="icon"></div>
                                <p class="discription"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section>
                <h2>Next week</h2>
                <ul id="future_days">
                    <li class="day">
                        <p class="date"></p>
                        <div class="icon"></div>
                        <p class="temperature"></p>
                    </li>
                    <li class="day">
                        <p class="date"></p>
                        <div class="icon"></div>
                        <p class="temperature"></p>
                    </li>
                    <li class="day">
                        <p class="date"></p>
                        <div class="icon"></div>
                        <p class="temperature"></p>
                    </li>
                    <li class="day">
                        <p class="date"></p>
                        <div class="icon"></div>
                        <p class="temperature"></p>
                    </li>
                    <li class="day">
                        <p class="date"></p>
                        <div class="icon"></div>
                        <p class="temperature"></p>
                    </li>
                    <li class="day">
                        <p class="date"></p>
                        <div class="icon"></div>
                        <p class="temperature"></p>
                    </li>
                    <li class="day">
                        <p class="date"></p>
                        <div class="icon"></div>
                        <p class="temperature"></p>
                    </li>
                </ul>
            </section>
        </div>
    </main>


    <footer>
        <p>Copyright (c) - Groep 12 - Odisee 2021</p>
    </footer>

    <script src="../scripts/weather.js"></script>

</body>
</html>
