<body>


    <header>
        <nav>
            <a class="logo" href="./"><strong>Weatherio</strong></a>
            <a class="skip-nav" href="#main-content">Skip Navigation</a>
            <button tabindex="0" onclick="toggleHamburger()" class="hamburger">
                <span id="lineOne" class="line"></span>
                <span id="lineTwo" class="line"></span>
                <span id="lineThree" class="line"></span>

            <ul class="nav-items">
                <li><a href="../weather">Home</a></li>
                <li><a href="../today">Today</a></li>

                <li><a href="../about/">about</a></li>
                <li id="nav-active"><a href="../contact/">Contact</a></li>
            </ul>
            <label id="darkmode-switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </nav>
    </header>

      <main id="main-content">
        <section id="contact">
          <div class="contact-box">
            <div class="contact-links">
              <h1>CONTACT</h1>
            </div>
            <div class="contact-form-wrapper">
                <form style="margin:5rem">
                    <div class="form-item">
                        <label for="name">Name</label><br>
                        <input type="text" id="name" name="fname"><br>
                    </div>
                    <div class="form-item">
                        <label for="email">Email</label><br>
                        <input type="email" id="email" name="lname"><br>
                    </div>
                    <div class="form-item">
                        <label for="message">Message</label><br>
                        <textarea name="message" id="message" rows="5" cols="40"></textarea><br>
                    </div>
                    <input class="btn-1" type="submit" value="Send">
                    <p class="msg-sent">Bericht verzonden</p>
                </form>
            </div>
          </div>
        </section>
      </main>
